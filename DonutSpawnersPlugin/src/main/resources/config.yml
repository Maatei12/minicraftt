# ╔══════════════════════════════════════════╗
# ║     DonutSpawners Plugin - Config        ║
# ╚══════════════════════════════════════════╝

# Cat de des se genereaza drops (in secunde)
# Default: 30 secunde per ciclu
tick-interval: 30

# Stoc maxim per spawner (cate iteme poate acumula inainte sa se umple)
max-stock: 1000

# Tipuri de spawnere si drop-urile lor
# format drops: MATERIAL:min-max (cantitate random per ciclu)
# Exact ca pe Donut SMP + cateva extra
spawner-types:

  SKELETON:
    display-name: "&fSpawner Skeleton"
    icon: BONE
    tier: S
    drops:
      - BONE:2-6
      - ARROW:4-12

  IRON_GOLEM:
    display-name: "&7Spawner Iron Golem"
    icon: IRON_INGOT
    tier: A
    drops:
      - IRON_INGOT:1-4
      - POPPY:0-2

  CREEPER:
    display-name: "&aSpawner Creeper"
    icon: GUNPOWDER
    tier: A
    drops:
      - GUNPOWDER:2-5

  ZOMBIFIED_PIGLIN:
    display-name: "&6Spawner Zombie Piglin"
    icon: GOLD_NUGGET
    tier: B
    drops:
      - GOLD_NUGGET:4-12
      - ROTTEN_FLESH:1-3

  BLAZE:
    display-name: "&eSpawner Blaze"
    icon: BLAZE_POWDER
    tier: B
    drops:
      - BLAZE_POWDER:2-6

  SPIDER:
    display-name: "&8Spawner Spider"
    icon: STRING
    tier: B
    drops:
      - STRING:2-6
      - SPIDER_EYE:1-3

  COW:
    display-name: "&fSpawner Cow"
    icon: BEEF
    tier: C
    drops:
      - BEEF:2-5
      - LEATHER:1-2

  PIG:
    display-name: "&dSpawner Pig"
    icon: PORKCHOP
    tier: C
    drops:
      - PORKCHOP:2-5

  # Extra spawnere (nu sunt pe Donut dar sunt utile)
  ZOMBIE:
    display-name: "&2Spawner Zombie"
    icon: ROTTEN_FLESH
    tier: C
    drops:
      - ROTTEN_FLESH:3-8
      - IRON_INGOT:0-1

  WITCH:
    display-name: "&5Spawner Vrajitoare"
    icon: GLASS_BOTTLE
    tier: B
    drops:
      - REDSTONE:2-6
      - GLOWSTONE_DUST:1-4
      - GLASS_BOTTLE:1-3
      - SUGAR:1-4

  GUARDIAN:
    display-name: "&bSpawner Guardian"
    icon: PRISMARINE_SHARD
    tier: A
    drops:
      - PRISMARINE_SHARD:2-6
      - COD:1-3

  ENDERMAN:
    display-name: "&8Spawner Enderman"
    icon: ENDER_PEARL
    tier: A
    drops:
      - ENDER_PEARL:1-3
