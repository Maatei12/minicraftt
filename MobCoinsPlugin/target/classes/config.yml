# Simbolul monedei afisat in mesaje
coin-symbol: "🍯"
coin-name: "Miere"

# ── Shop Fly (timp de zbor cumparat cu Miere) ────────────────────────────────
# Comanda executata: /fly add <jucator> <secunde>
fly-shop:
  - duration: 300      # 5 minute
    price: 200
    name: "&b✈ Fly &75 Minute"
    lore:
      - "&75 minute de zbor"
      - "&ePret: &6200 Miere"

  - duration: 900      # 15 minute
    price: 500
    name: "&b✈ Fly &715 Minute"
    lore:
      - "&715 minute de zbor"
      - "&ePret: &6500 Miere"

  - duration: 1800     # 30 minute
    price: 900
    name: "&b✈ Fly &730 Minute"
    lore:
      - "&730 minute de zbor"
      - "&ePret: &6900 Miere"

  - duration: 3600     # 1 ora
    price: 1500
    name: "&b✈ Fly &71 Ora"
    lore:
      - "&71 ora de zbor"
      - "&ePret: &61,500 Miere"

  - duration: 10800    # 3 ore
    price: 3500
    name: "&b✈ Fly &73 Ore"
    lore:
      - "&73 ore de zbor"
      - "&ePret: &63,500 Miere"

  - duration: 86400    # 1 zi
    price: 20000
    name: "&6✈ Fly &71 Zi"
    lore:
      - "&71 zi intreaga de zbor"
      - "&ePret: &620,000 Miere"

# ── Recompense per mob (in Miere) ────────────────────────────────────────
# Mobs comune = putine coins
# Mobs rare/puternice = mai multe coins
# Sansa de drop (0.0 - 1.0): 1.0 = mereu, 0.5 = 50% sansa
